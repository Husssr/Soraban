<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Soroban</title>
  <meta name="description" content="Soroban / mental abacus practice game · จินตคณิต">
  <meta name="theme-color" content="#fafaf8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <script>
    // Apply saved theme / language / motion before first paint (avoids a flash).
    // Key format must match js/core/storage.js ("soroban:" + "data").
    try {
      var saved = JSON.parse(localStorage.getItem('soroban:data')) || {};
      var s = saved.settings || {};
      var root = document.documentElement;
      if (s.theme === 'light' || s.theme === 'dark') root.dataset.theme = s.theme;
      if (s.lang === 'en') root.lang = 'en';
      if (s.reduceMotion === true) root.classList.add('reduce-motion');
    } catch (e) { /* storage unavailable: defaults apply */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="app.skip"></a>

  <header class="topbar">
    <a class="brand" href="#/home">
      <svg class="brand__logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="2"/>
        <line x1="9" y1="3" x2="9" y2="21" stroke="currentColor" stroke-width="1.5"/>
        <line x1="15" y1="3" x2="15" y2="21" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="9" cy="6" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/>
      </svg>
      <span class="brand__name" data-i18n="app.name"></span>
    </a>
    <nav class="topbar__actions">
      <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" data-i18n-attr="aria-label:header.sound;title:header.sound">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path class="icon-on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
          <path class="icon-off" d="M17 9l5 6M22 9l-5 6"/>
        </svg>
      </button>
      <button id="btn-lang" class="icon-btn icon-btn--text" type="button" data-i18n-attr="aria-label:header.lang;title:header.lang">
        <span id="lang-label"></span>
      </button>
      <a id="btn-settings" class="icon-btn" href="#/settings" data-i18n-attr="aria-label:nav.settings;title:nav.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
          <circle cx="9" cy="7" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="8" cy="17" r="2" fill="var(--bg)"/>
        </svg>
      </a>
    </nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">กรุณาเปิดใช้งาน JavaScript เพื่อใช้แอปนี้ · Please enable JavaScript to use this app.</p>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
